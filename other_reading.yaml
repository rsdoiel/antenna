# other_reading.yaml is an example of how to setup a feed page.
# I've included most of what I include in my own Antenna.

# These are elements rendered in the HTML head element
link:
  - rel: stylesheet
    href: css/site.css

script:
  - type: module
    src: modules/date_filter.js
  - type: module
    src: modules/article_collapse.js

# What follows are rendered in the HTML body element
header: |
  <a href="#main-content" class="skip-nav">Skip to main content</a>
  <img class="logo"
      src="./media/Antenna_1_-_The_Noun_Project.svg"
      alt="line art showing an antenna"
      height="80" width="60" >
  <h1>The Antenna</h1>
  <h2>finding signal in the noise</h2>

nav: |
  <ul>
    <li><a href="./" "A personal news aggregation, finding signal in the noise">The Antenna</a></li>
    <li><a href="README.html" "How to implement your own Antennna">Implementation</a></li>
    <li><a href="about.html" "About the Antenna Project">About</a></li>
  </ul>
  <hr>
  <ul>
    <li><a href="ebooks_items.html">eBooks</a></li>
    <li><a href="science_and_technology_items.html" "Science and Technology News">STEM</a></li>
    <li><a href="retro_computing_items.html">Retro</a></li>
    <li><a href="home_items.html">Urban Farm</a></li>
    <li><a href="food_items.html">Healthy Eats</a></li>
    <li><a href="small_papers_items.html">Small Papers</a></li>
    <li><a href="journalism_items.html">Student Papers</a></li>
    <li><a href="writing_items.html">Writing</a></li>
    <li><a href="craft_items.html">Craft</a></li>
  </ul>

top_content: |
  <div class="article-filter"><label for="filter-by-date">Filter by date:</label> <input id="filter-by-date" type="date"></div>

footer: |
  Antenna is a personal aggregation of items found around the web.<br>
  Curated with <a href="https://rsdoiel.github.io/antennaApp">antennaApp</a>.


